<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header class="header">

        <div class="navigation">
            <div class="name">
                <img src="https://cdn-icons-png.flaticon.com/512/6545/6545461.png" width="70" height="70">
                <p class="hero-name"><b>BUS</b>ROUTE</p>
            </div>

            <div class="navi">
                <nav class="nav">
                    <a class="nav nav-active" href="">Home</a>
                    <a class="nav nav-active2" href="">Explore</a>
                    <a class="nav nav-active3" href="">Booking</a>
                    <a class="nav nav-active4" href="">Help</a>
                    <button class="but-nav">Sing in </button>
                </nav>
            </div>
        </div>



        <div class="all-name">

            <div class="buss">
                <p class="all-bus">
                    JOUREY BEYOND. <br>
                    BOOK YOUR <br>
                    BUS TICKET.
                </p>

                <button class="all-button">Learn More</button>
            </div>




            <div class="register">

                <div class="none">
                    <a class="tick" href="">Booking</a>
                    <a class="tick" href="">Preview</a>
                </div>

                <form class="form">

                    <label for="">FROM</label>
                    <input class="inp" placeholder="From to from" type="text">

                    <label for="">TO</label>
                    <input class="inp" placeholder="from to" type="text">

                    <label for="">Date</label>
                    <input class="inp" placeholder="09/06/2022" type="date">

                    <label for="">PASSENGERS</label>
                    <input class="inp" min="1" max="10" placeholder="Passengers" type="number">

                    <button class="submit" type="submit">Booking</button>
                  
                </form>

            </div>

        </div>

    </header>













</body>

</html>
